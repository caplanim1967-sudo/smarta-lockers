[env:lilygo-t-sim7600]
platform       = espressif32
board          = esp32dev
framework      = arduino
monitor_speed  = 115200
upload_speed   = 921600

lib_deps =
    vshymanskyy/TinyGSM @ ^0.11.7
    https://github.com/OPEnSLab-OSU/SSLClient.git
    arduino-libraries/ArduinoHttpClient @ ^0.5.0
    bblanchon/ArduinoJson @ ^6.21.5

build_flags =
    -DTINY_GSM_MODEM_SIM7600
    -DTINY_GSM_USE_GPRS=1
    -DARDUINO_USB_CDC_ON_BOOT=0
